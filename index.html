<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <title>لعبة من الكاذب؟</title>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="pngegg.png" type="image/png">
    </head>
    <body>
        <h1>🕵️‍♂️ من الكاذب؟</h1>
        <div id="story" class="fade-in"></div>
        <div id="characters"></div>
        <div id="feedback"></div>

        <div class="results-box">
            <div id="score">🌟 نتيجتك: 0</div>
            <div id="highScore">🏆 أعلى نتيجة: 0</div>
            <div id="tries">🌀 المحاولات المتبقية: 3</div>
            <div id="timer">⏱ الوقت المتبقي: 30 ثانية</div>
        </div>

        <button class="restart" onclick="restartGame()">🔁 إعادة اللعبة</button>

        <audio id="startSound" src="start.mp3"></audio>
        <audio id="correctSound" src="correct.mp3"></audio>
        <audio id="wrongSound" src="wrong.mp3"></audio>

        <script src="script.js"></script>
    </body>
</html>
